# Git hooks (lefthook). langgraph의 CI 게이트를 로컬에서 미리 강제.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    verify:
      run: bun run typecheck && bun test
